<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lunar client</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(-45deg, #000000, #0f172a, #111827, #000000);
      background-size: 400% 400%;
      animation: bgMove 15s ease infinite;
      font-family: sans-serif;
    }

    @keyframes bgMove {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .hero-title {
      text-shadow:
        0 0 10px white,
        0 0 20px white,
        0 0 40px #38bdf8;
      animation: glowPulse 3s infinite;
    }

    @keyframes glowPulse {
      0% {
        text-shadow:
          0 0 10px white,
          0 0 20px white,
          0 0 40px #38bdf8;
      }

      50% {
        text-shadow:
          0 0 20px white,
          0 0 40px white,
          0 0 60px #0ea5e9;
      }

      100% {
        text-shadow:
          0 0 10px white,
          0 0 20px white,
          0 0 40px #38bdf8;
      }
    }

    .floating {
      animation: floating 4s ease-in-out infinite;
    }

    @keyframes floating {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .download-btn {
      position: relative;
      overflow: hidden;
    }

    .download-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.3);
      transition: 0.6s;
    }

    .download-btn:hover::before {
      left: 100%;
    }

    .fade-up {
      opacity: 0;
      transform: translateY(40px);
      animation: fadeUp 1s forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.2;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

<body class="text-white">

  <div class="stars"></div>

  <section class="relative h-screen flex items-center justify-center text-center px-6">

    <div class="relative z-10 max-w-4xl fade-up">

      <h1 class="hero-title floating text-6xl md:text-8xl font-extrabold mb-6">
        Lunar Client
      </h1>

      <p class="text-xl md:text-2xl text-gray-300 mb-10">
        The best Minecraft PvP client with insane FPS boost,
        smooth gameplay and clean experience.
      </p>

      <a href="downloads.html"
        class="download-btn inline-block bg-white text-black px-10 py-4 rounded-2xl text-xl font-bold hover:bg-cyan-300 hover:scale-105 transition duration-300 shadow-2xl shadow-cyan-500/20">

        Download Lunar Client

      </a>

    </div>

  </section>

  <script>
    const starsContainer = document.querySelector(".stars");

    for (let i = 0; i < 120; i++) {
      const star = document.createElement("div");

      star.classList.add("star");

      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";

      star.style.animationDelay = Math.random() * 3 + "s";

      starsContainer.appendChild(star);
    }
  </script>

</body>
</html>
